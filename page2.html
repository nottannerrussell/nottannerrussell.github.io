<!DOCTYPE html>
<html lang="eng">
<body>

<!-- Trigger Button -->
<button onclick="togglePopup(true)">Open Traditional Popup</button>

<!-- Popup Overlay Background -->
<div id="popupOverlay" class="overlay">
  <!-- Popup Content Box -->
  <div class="popup-box">
    <h2>Welcome!</h2>
    <p>This is a custom styled popup window.</p>
    <button onclick="togglePopup(false)">Close</button>
  </div>
</div>




    
</body>
</html>
